<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d12" />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png" />
    <title>Page not found / Страница не найдена — Eduard Sultanov</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; background: #080d12; color: #eef7f8; font-family: Inter, system-ui, sans-serif; }
      main { width: min(100%, 620px); padding: 48px; border: 1px solid rgba(0, 173, 216, 0.3); border-radius: 24px; background: #0d151c; }
      p:first-child { color: #5eead4; font-family: Consolas, monospace; font-size: 13px; }
      h1 { margin: 0 0 16px; font-size: clamp(42px, 10vw, 72px); letter-spacing: -0.05em; }
      h1 span { display: block; margin-top: 8px; color: #8b9dad; font-size: 0.42em; letter-spacing: -0.025em; }
      p { color: #8b9dad; line-height: 1.7; }
      a { display: inline-block; margin-top: 18px; padding: 12px 18px; border-radius: 10px; background: #00add8; color: #031014; font-weight: 750; text-decoration: none; }
      a:focus-visible { outline: 3px solid #5eead4; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p>404 / NOT_FOUND</p>
      <h1>Wrong turn.<span lang="ru">Страница не найдена.</span></h1>
      <p>
        The page you are looking for does not exist.<br />
        <span lang="ru">Запрошенной страницы не существует.</span>
      </p>
      <a href="/"><span>Back to portfolio</span><span aria-hidden="true"> / </span><span lang="ru">Вернуться в портфолио</span></a>
    </main>
  </body>
</html>
